<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AgentGateway</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #0f0f0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

  header { padding: 16px 24px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; color: #fff; font-weight: bold; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
  .dot.green { background: #22c55e; }

  .provider-select { margin-left: auto; display: flex; gap: 8px; }
  .provider-select button {
    padding: 4px 12px; border-radius: 4px; border: 1px solid #333;
    background: #1a1a1a; color: #888; cursor: pointer; font-family: monospace; font-size: 12px;
  }
  .provider-select button.active { border-color: #3b82f6; color: #3b82f6; background: #0f1929; }

  .trace { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 8px; }

  .event {
    padding: 10px 14px; border-radius: 6px; border-left: 3px solid #333;
    font-size: 13px; line-height: 1.6; animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .event.thought    { border-color: #6366f1; background: #1a1929; color: #a5b4fc; }
  .event.tool_call  { border-color: #f59e0b; background: #1a1700; color: #fcd34d; }
  .event.tool_result{ border-color: #10b981; background: #001a12; color: #6ee7b7; }
  .event.final_answer { border-color: #3b82f6; background: #0f1929; color: #93c5fd; }
  .event.error      { border-color: #ef4444; background: #1a0f0f; color: #fca5a5; }
  .event.system     { border-color: #333; color: #555; font-size: 12px; }

  .event-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; margin-bottom: 4px; }

  .meta { font-size: 11px; opacity: 0.5; margin-top: 6px; }

  .input-area {
    padding: 16px 24px; border-top: 1px solid #222;
    display: flex; gap: 12px; align-items: flex-end;
  }
  textarea {
    flex: 1; background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
    color: #e0e0e0; font-family: monospace; font-size: 13px;
    padding: 10px 14px; resize: none; outline: none; min-height: 44px; max-height: 120px;
  }
  textarea:focus { border-color: #3b82f6; }
  button#send {
    padding: 10px 20px; background: #3b82f6; color: #fff;
    border: none; border-radius: 6px; cursor: pointer;
    font-family: monospace; font-size: 13px; font-weight: bold;
    white-space: nowrap;
  }
  button#send:disabled { background: #1e3a5f; color: #4b6a9a; cursor: not-allowed; }

  .empty { color: #333; font-size: 13px; margin: auto; text-align: center; line-height: 2; }
</style>
</head>
<body>

<header>
  <div class="dot" id="status-dot"></div>
  <h1>ReAct agent framework</h1>
  <div class="provider-select">
    <button class="active" onclick="setProvider('gemini', this)">gemini</button>
    <button onclick="setProvider('ollama', this)">ollama</button>
  </div>
</header>

<div class="trace" id="trace">
  <div class="empty">
    Type a task below and press Run.<br>
    The agent will reason and act in real time.
  </div>
</div>

<div class="input-area">
  <textarea id="task" placeholder="e.g. Search for latest AI news and summarize the top findings" rows="1"
    onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();run();}"></textarea>
  <button id="send" onclick="run()">Run</button>
</div>

<script>
  let provider = 'gemini';

  function setProvider(name, btn) {
    provider = name;
    document.querySelectorAll('.provider-select button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function addEvent(type, content, meta = null) {
    const trace = document.getElementById('trace');

    // remove empty state
    const empty = trace.querySelector('.empty');
    if (empty) empty.remove();

    const div = document.createElement('div');
    div.className = `event ${type}`;

    const label = document.createElement('div');
    label.className = 'event-label';
    label.textContent = type.replace('_', ' ');
    div.appendChild(label);

    const text = document.createElement('div');
    text.textContent = content;
    div.appendChild(text);

    if (meta && Object.keys(meta).length > 0) {
      const metaDiv = document.createElement('div');
      metaDiv.className = 'meta';
      metaDiv.textContent = JSON.stringify(meta);
      div.appendChild(metaDiv);
    }

    trace.appendChild(div);
    trace.scrollTop = trace.scrollHeight;
    return div;
  }

  function setStatus(connected) {
    document.getElementById('status-dot').className = 'dot' + (connected ? ' green' : '');
  }

  async function run() {
    const task = document.getElementById('task').value.trim();
    if (!task) return;

    const btn = document.getElementById('send');
    btn.disabled = true;
    btn.textContent = 'Running...';
    setStatus(true);

    // clear trace
    document.getElementById('trace').innerHTML = '';
    addEvent('system', `Task: ${task}`);

    try {
      const response = await fetch('/agent/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task, provider })
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const text = decoder.decode(value);
        const lines = text.split('\n');

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const event = JSON.parse(line.slice(6));
            if (event.type === 'done') break;
            if (event.type !== 'done') {
              addEvent(event.type, event.content, event.metadata);
            }
          } catch (e) { /* skip malformed */ }
        }
      }

    } catch (err) {
      addEvent('error', `Connection error: ${err.message}`);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Run';
      setStatus(false);
    }
  }
</script>
</body>
</html>
